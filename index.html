<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Management Portal — Elmeasure</title>
<style>
  :root{
    --navy:#0B2942; --volt:#0073C8; --ink:#eef1f6;
    --text-hi:#16264d; --text-mid:#3b5384; --text-lo:#7a8fb8;
    --line:#d8dce6; --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Calibri','Carlito',sans-serif;}

  .shell{display:flex;flex-direction:column;height:100vh;}

  /* ---------- Horizontal top bar, matching the Friday Review sheet's header ---------- */
  .topbar{
    display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:18px;
    background:linear-gradient(120deg,var(--navy),var(--volt) 130%);
    padding:14px 22px;box-shadow:0 4px 14px rgba(20,42,92,.18);z-index:10;flex:0 0 auto;
  }
  .brand{display:flex;align-items:center;gap:14px;}
  .logo-badge{
    background:linear-gradient(135deg,#123a5c,#06192b);border:1px solid rgba(255,255,255,.18);
    border-radius:999px;padding:6px 16px 6px 6px;display:flex;align-items:center;
    box-shadow:0 4px 14px rgba(0,0,0,.35);flex:0 0 auto;
  }
  .logo-chip{
    background:#fff;border-radius:9px;padding:7px 14px;display:flex;align-items:center;
    justify-content:center;box-shadow:0 2px 8px rgba(0,0,0,.18);
  }
  .logo-chip img{height:30px;width:auto;display:block;}
  .brand-title{font-weight:700;font-size:18px;letter-spacing:.04em;line-height:1.2;color:#fff;}
  .brand-sub{font-size:12px;color:rgba(255,255,255,.72);margin-top:2px;letter-spacing:.02em;}

  .seg{display:flex;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:3px;}
  .tab-btn{
    font-weight:600;font-size:13px;letter-spacing:.02em;color:var(--text-mid);background:transparent;
    border:none;padding:8px 18px;border-radius:7px;cursor:pointer;transition:background .2s,color .2s;
  }
  .tab-btn.active{background:rgba(0,115,200,.1);color:var(--volt);}
  .tab-btn:hover{color:var(--text-hi);}

  .content{flex:1;position:relative;overflow:hidden;}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:var(--ink);}
  iframe.active{display:block;}
  .boot-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-lo);font-family:monospace;font-size:13px;}
</style>
</head>

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);

Object.keys(PAYLOADS).forEach(key => {
  const iframe = document.getElementById('frame-' + key);
  iframe.srcdoc = b64ToUtf8(PAYLOADS[key]);
});
document.getElementById('bootMsg').remove();

function activateTab(target){
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.querySelector(`.tab-btn[data-target="${target}"]`)?.classList.add('active');
  document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
  document.getElementById('frame-' + target)?.classList.add('active');
}
// Exposed so child iframes (e.g. a "View Cumulative" shortcut button inside
// the Leads tab) can switch tabs directly via window.parent.activateTab(...).
window.activateTab = activateTab;

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  activateTab(btn.dataset.target);
});

const params = new URLSearchParams(location.search);
const initial = params.get('tab');
if (initial && document.getElementById('frame-' + initial)) {
  activateTab(initial);
}
</script>
