<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PulseBoard — GM Sales Command Deck</title>
<style>
  :root{
    --navy:#0B2942; --volt:#0073C8; --ink:#eef1f6;
    --text-hi:#16264d; --text-mid:#3b5384; --text-lo:#7a8fb8;
    --line:#d8dce6; --panel:#ffffff;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;background:var(--ink);font-family:'Calibri','Carlito',sans-serif;}
  .topbar{
    display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;
    background:linear-gradient(120deg,var(--navy),var(--volt) 130%);
    padding:14px 24px;box-shadow:0 4px 14px rgba(20,42,92,.18);
  }
  .brand{color:#fff;font-weight:700;font-size:18px;letter-spacing:.03em;display:flex;align-items:center;gap:10px;}
  .brand .dot{width:9px;height:9px;border-radius:50%;background:#3ddc84;box-shadow:0 0 0 3px rgba(61,220,132,.25);}
  .tabs{display:flex;gap:6px;background:rgba(255,255,255,.12);padding:4px;border-radius:10px;}
  .tab-btn{
    border:none;background:transparent;color:rgba(255,255,255,.75);font-weight:600;font-size:13.5px;
    padding:9px 18px;border-radius:7px;cursor:pointer;transition:all .15s ease;
  }
  .tab-btn:hover{color:#fff;}
  .tab-btn.active{background:#fff;color:var(--volt);box-shadow:0 2px 8px rgba(0,0,0,.15);}
  .frame-wrap{position:relative;height:calc(100vh - 62px);}
  iframe{position:absolute;inset:0;width:100%;height:100%;border:none;display:none;background:var(--ink);}
  iframe.active{display:block;}
  .boot-msg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-lo);font-family:monospace;font-size:13px;}
</style>
</head>

/* Each dashboard below is a COMPLETE, self-contained HTML document (its own
   CSS and JS), base64-encoded and injected into its own iframe via srcdoc.
   This keeps them fully isolated from each other (no ID/class collisions)
   while still shipping as a single file. srcdoc iframes inherit the parent
   page's origin, so relative fetches like '/api/leads' still resolve
   correctly against your Netlify site. */

function b64ToUtf8(b64) {
  const binary = atob(b64);
  const bytes = new Uint8Array(binary.length);
  for (let i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
  return new TextDecoder('utf-8').decode(bytes);
}

Object.keys(PAYLOADS).forEach(key => {
  const iframe = document.getElementById('frame-' + key);
  iframe.srcdoc = b64ToUtf8(PAYLOADS[key]);
});
document.getElementById('bootMsg').remove();

document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('.tab-btn');
  if (!btn) return;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  const target = btn.dataset.target;
  document.querySelectorAll('iframe').forEach(f => f.classList.remove('active'));
  document.getElementById('frame-' + target).classList.add('active');
});

const params = new URLSearchParams(location.search);
const initial = params.get('tab');
if (initial && document.getElementById('frame-' + initial)) {
  document.querySelector(`.tab-btn[data-target="${initial}"]`)?.click();
}
</script>
